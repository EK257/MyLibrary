<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${collection.name} + ' — Коллекция'">Коллекция</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f0f2f5;
            color: #2d3748;
            font-family: system-ui, sans-serif;
            padding-top: 70px;
        }
        .navbar-main {
            background: #1a1a1a;
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            z-index: 1000;
        }
        .navbar-content {
            max-width: 1200px;
            margin: auto;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
        }
        .navbar-brand-text {
            color: white;
            font-weight: 700;
            font-size: 1.4rem;
            text-decoration: none;
        }
        .main-container {
            max-width: 1200px;
            margin: auto;
            padding: 20px 15px;
        }
        .card {
            border-radius: 8px;
            transition: all 0.2s ease;
            border: 1px solid #e2e8f0;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: #739373;
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }
        .btn-nature {
            background: #1e352f;
            color: white;
            border: none;
        }
        .btn-outline-nature {
            border: 1px solid #739373;
            color: #739373;
        }
        .btn-outline-nature:hover {
            background: #739373;
            color: white;
        }
        .badge-genre {
            background: #739373;
            color: white;
            font-size: 12px;
        }
        .badge-type {
            background: #e2e8f0;
            color: #4a5568;
            font-size: 12px;
        }
    </style>
</head>

<body>

<nav class="navbar-main">
    <div class="navbar-content">
        <div class="d-flex align-items-center">
            <a href="/" class="navbar-brand-text">Моя Библиотека</a>
            <a href="/collections" class="btn btn-outline-nature btn-sm ms-3">Коллекции</a>
        </div>
        <a href="/collections" class="btn btn-nature btn-sm">← Назад</a>
    </div>
</nav>

<div class="main-container">
    <h2 class="fw-bold mb-4" style="color:#1e352f;" th:text="${collection.name}"></h2>

    <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3" th:each="book : ${collection.books}">
            <div class="card p-3 h-100" th:onclick="|window.location.href='/books/${book.id}'|">
                <div style="height: 240px; background:#f7fafc; display:flex; align-items:center; justify-content:center; overflow:hidden;">

                    <img th:if="${book.coverImage != null && !book.coverImage.isEmpty()}"
                         th:src="${book.coverImage}"
                         style="width:100%; height:100%; object-fit:cover;">

                    <img th:if="${(book.coverImage == null || book.coverImage.isEmpty()) && book.coverUrl != null && !book.coverUrl.isEmpty()}"
                         th:src="${book.coverUrl}"
                         style="width:100%; height:100%; object-fit:cover;">

                    <span th:if="${(book.coverImage == null || book.coverImage.isEmpty()) && (book.coverUrl == null || book.coverUrl.isEmpty())}">
                        Нет обложки
                    </span>

                </div>

                <h6 class="fw-bold mt-2 text-truncate" style="color:#1e352f;" th:text="${book.title}"></h6>

                <div class="text-muted small text-truncate" th:text="${book.author}"></div>

                <div class="mt-2">
                    <span class="badge badge-genre"
                          th:text="${book.genre}">
                    </span>

                    <span class="badge badge-type ms-1"
                          th:switch="${book.bookType}">
                        <span th:case="'PAPER'">Бумажная</span>
                        <span th:case="'EBOOK'">Электронная</span>
                        <span th:case="'AUDIO'">Аудио</span>
                        <span th:case="*">Другое</span>
                    </span>
                </div>

                <form th:action="@{/collections/{c}/remove/{b}(c=${collection.id}, b=${book.id})}"
                      method="post"
                      onclick="event.stopPropagation();"
                      class="mt-3">

                    <button class="btn btn-sm btn-outline-danger w-100">Убрать</button>
                </form>
            </div>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(collection.books)}"
         class="text-center mt-5">
        <h5 class="text-muted">Коллекция пустая</h5>
    </div>
</div>
</body>
</html>
