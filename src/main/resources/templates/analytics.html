<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Аналитика</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: #f0f2f5;
            font-family: system-ui, sans-serif;
            color: #2d3748;
            padding-top: 70px;
        }
        .navbar-main {
            background: #1a1a1a;
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            z-index: 1000;
        }
        .navbar-inner {
            max-width: 1200px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }
        .brand {
            color: #fff;
            font-weight: 700;
            font-size: 1.4rem;
            text-decoration: none;
        }
        .brand:hover {
            color: #739373;
        }
        .btn-nature {
            background: #1e352f;
            color: #fff;
            border: none;
        }
        .btn-nature:hover {
            background: #142420;
            color: #fff;
        }
        .btn-outline-nature {
            border: 1px solid #739373;
            color: #739373;
            background: transparent;
        }
        .btn-outline-nature:hover {
            background: #739373;
            color: #fff;
        }
        .container-main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 15px;
        }
        .stat-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 18px;
            text-align: center;
        }
        .stat-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: #1e352f;
        }
        .text-olive { color: #739373; }
        .chart-box {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            height: 320px;
        }
        .table th {
            background: #1e352f;
            color: #fff;
            font-size: 0.85rem;
        }
        .clickable-row {
            cursor: pointer;
        }
        .clickable-row:hover {
            background: #edf2f0 !important;
        }
    </style>
</head>
<body>
<nav class="navbar-main">
    <div class="navbar-inner">
        <div class="d-flex align-items-center">
            <a href="/" class="brand">Моя Библиотека</a>
            <a href="/collections" class="btn btn-outline-nature btn-sm ms-3">Коллекции</a>
            <a href="/analytics" class="btn btn-nature btn-sm ms-2">Аналитика</a>
        </div>

        <a href="/books/add" class="btn btn-nature btn-sm">+ Добавить</a>
    </div>
</nav>

<div class="container-main">
    <h2 class="fw-bold mb-4" style="color:#1e352f;">Аналитика</h2>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="stat-card">
                <div class="small text-muted">Всего</div>
                <div class="stat-number" th:text="${totalBooks}">0</div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="stat-card">
                <div class="small text-muted">Прочитано</div>
                <div class="stat-number text-success" th:text="${completedBooks}">0</div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="stat-card">
                <div class="small text-muted">Читаю</div>
                <div class="stat-number text-warning" th:text="${readingBooks}">0</div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="stat-card">
                <div class="small text-muted">В планах</div>
                <div class="stat-number text-olive"
                     th:text="${unreadBooks != null ? unreadBooks.size() : 0}">
                    0
                </div>
            </div>
        </div>

    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-8">
            <div class="chart-box">
                <h5 class="fw-bold mb-3" style="color:#1e352f;">
                    Жанры
                </h5>
                <canvas id="genresChart"></canvas>
            </div>
        </div>

        <div class="col-md-4">
            <div class="chart-box">
                <h5 class="fw-bold mb-3" style="color:#1e352f;">
                    Форматы
                </h5>
                <canvas id="formatsChart"></canvas>
            </div>
        </div>
    </div>

    <div class="chart-box" style="height:auto;">

        <h5 class="fw-bold mb-3" style="color:#1e352f;">Непрочитанные книги</h5>

        <div th:if="${#lists.isEmpty(unreadBooks)}"
             class="text-muted text-center py-3">
            Всё прочитано
        </div>

        <div th:if="${!#lists.isEmpty(unreadBooks)}">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Название</th>
                    <th>Автор</th>
                    <th>Жанр</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="book : ${unreadBooks}"
                    th:onclick="|window.location.href='/books/${book.id}'|"
                    class="clickable-row">
                    <td th:text="${book.title}">Title</td>
                    <td th:text="${book.author}">Author</td>
                    <td th:text="${book.genre}">Genre</td>

                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const genreLabels = /*[[${genreLabels}]]*/ [];
    const genreData = /*[[${genreData}]]*/ [];
    const formatData = /*[[${formatData}]]*/ [];

    new Chart(document.getElementById('genresChart'), {
        type: 'bar',
        data: {
            labels: genreLabels,
            datasets: [{data: genreData, backgroundColor: '#739373'}]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } }
        }
    });

    new Chart(document.getElementById('formatsChart'), {
        type: 'doughnut',
        data: {
            labels: ['Бумажные', 'Электронные', 'Аудио'],
            datasets: [{
                data: formatData,
                backgroundColor: ['#1e352f', '#739373', '#a8c3c7']
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '60%',
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });
</script>
</body>
</html>
